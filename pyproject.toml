[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ori"
version = "0.1.0"
description = "Learn physical skills from video"
requires-python = ">=3.11"
dependencies = ["google-genai>=2.0.0,<3", "python-dotenv>=1.0,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
